<!DOCTYPE html>
<html>
<head>
  <title>Dashboard Multi Sheet</title>
</head>
<body>

<h1>Dashboard Tenaga Kerja</h1>

<select id="sheetSelect"></select>
<table border="1" id="table"></table>

<script>
const API = "https://script.google.com/macros/s/AKfycbxVqTE84jSZkDt5uxUuHOmtSsb3N2q5AO3KncaqheGGwwoAEavZtUwvw9Ghp7othNPuYw/exec
";

fetch(API)
.then(res => res.json())
.then(data => {

  const select = document.getElementById("sheetSelect");
  const table = document.getElementById("table");

  const sheetNames = Object.keys(data);

  // isi dropdown
  sheetNames.forEach(name => {
    select.innerHTML += `<option value="${name}">${name}</option>`;
  });

  function render(sheetName){
    const sheetData = data[sheetName];

    if (!sheetData || sheetData.length === 0) {
      table.innerHTML = "<tr><td>DATA KOSONG</td></tr>";
      return;
    }

    const headers = Object.keys(sheetData[0]);

    table.innerHTML = "<tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr>";

    sheetData.forEach(row => {
      table.innerHTML += "<tr>" +
        headers.map(h => `<td>${row[h] || '-'}</td>`).join("") +
        "</tr>";
    });
  }

  select.onchange = () => render(select.value);

  render(sheetNames[0]); // tampil pertama

});
</script>

</body>
</html>
