<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Tenaga Kerja</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #f5f7fb;
    }

    header {
      background: #1e3a8a;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
    }

    .container {
      padding: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      padding: 20px;
      border-radius: 12px;
      color: white;
      font-size: 18px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .total { background: #2563eb; }
    .masuk { background: #16a34a; }
    .keluar { background: #dc2626; }
    .kurang { background: #f59e0b; }

    .chart-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    th {
      background: #1e3a8a;
      color: white;
      padding: 10px;
    }

    td {
      padding: 8px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    tr:hover {
      background: #f1f5f9;
    }
  </style>
</head>

<body>

<header>📊 Dashboard Tenaga Kerja</header>

<div class="container">

  <!-- KPI -->
  <div class="cards" id="cards"></div>

  <!-- Chart -->
  <div class="chart-box">
    <canvas id="lineChart"></canvas>
  </div>

  <div class="chart-box">
    <canvas id="barChart"></canvas>
  </div>

  <!-- Table -->
  <table id="table"></table>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyyz_DIp4a6OsrgJ0D5nUFTIE22AbS7vaDUQNFO6hCMZRzcAJGnwLOOaNh7SG6FAoF-/exec";

fetch(API)
.then(res => res.json())
.then(data => {

  let last = data[data.length - 1];

  // KPI
  document.getElementById("cards").innerHTML = `
    <div class="card total">Total<br><h2>${last.Total}</h2></div>
    <div class="card masuk">Masuk<br><h2>${last.Masuk}</h2></div>
    <div class="card keluar">Keluar<br><h2>${last.Keluar}</h2></div>
    <div class="card kurang">Kekurangan<br><h2>${last.Kekurangan}</h2></div>
  `;

  // Data chart
  const labels = data.map(d => d.Tanggal);
  const total = data.map(d => d.Total);
  const masuk = data.map(d => d.Masuk);
  const keluar = data.map(d => d.Keluar);

  // Line Chart
  new Chart(document.getElementById("lineChart"), {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        { label: 'Total', data: total, borderWidth: 2 },
      ]
    }
  });

  // Bar Chart
  new Chart(document.getElementById("barChart"), {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        { label: 'Masuk', data: masuk },
        { label: 'Keluar', data: keluar }
      ]
    }
  });

  // Table
  let table = document.getElementById("table");
  let headers = Object.keys(data[0]);

  table.innerHTML += "<tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr>";

  data.forEach(row => {
    table.innerHTML += "<tr>" + headers.map(h => `<td>${row[h]}</td>`).join("") + "</tr>";
  });

});
</script>

</body>
</html>
