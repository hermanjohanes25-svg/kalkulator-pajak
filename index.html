<!DOCTYPE html>
<html>
<head>
  <title>Dashboard Stabil</title>
  <style>
    body { font-family: Arial; padding:20px; background:#f5f5f5;}
    h1 { text-align:center; }
    table { width:100%; border-collapse:collapse; background:white;}
    th, td { border:1px solid #ccc; padding:8px; text-align:center;}
    th { background:#333; color:white;}
  </style>
</head>

<body>

<h1>Dashboard Tenaga Kerja</h1>

<div id="status">Loading data...</div>

<table id="table"></table>

<script>
const API = "https://script.google.com/macros/s/AKfycby9bWCt0ceB_bnloXNAFoJCPx_ne1U30UY_uwXW9PaYE4Pt4RnbuSHnESsx_CWbOWAf/exec";

fetch(API)
.then(res => res.json())
.then(data => {

  console.log("DATA:", data);

  const table = document.getElementById("table");
  const status = document.getElementById("status");

  if (!data || data.length === 0) {
    status.innerHTML = "❌ Data kosong / belum terbaca";
    return;
  }

  status.innerHTML = "✅ Data berhasil dimuat";

  const headers = Object.keys(data[0]);

  // header tabel
  table.innerHTML = "<tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr>";

  // isi data
  data.forEach(row => {
    table.innerHTML += "<tr>" +
      headers.map(h => `<td>${row[h] || '-'}</td>`).join("") +
      "</tr>";
  });

})
.catch(err => {
  document.getElementById("status").innerHTML = "❌ ERROR: " + err;
});
</script>

</body>
</html>
