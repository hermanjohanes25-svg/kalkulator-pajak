<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard Multi Sheet</title>

<style>
body { font-family: Arial; padding:20px; background:#f5f5f5;}
h1 { text-align:center; }

select {
  padding:10px;
  margin-bottom:15px;
}

table {
  width:100%;
  border-collapse:collapse;
  background:white;
}

th, td {
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
}

th {
  background:#333;
  color:white;
}

.status {
  margin-bottom:10px;
  font-weight:bold;
}
</style>

</head>

<body>

<h1>Dashboard Tenaga Kerja</h1>

<div class="status" id="status">⏳ Loading...</div>

<select id="sheetSelect"></select>

<table id="table"></table>

<script>

// 🔴 GANTI DENGAN URL API BARU
const API = "https://script.google.com/macros/s/AKfycbyS65iL9bCzmhFzUY2QlhEssGKOdYsMs9Y869GSsHlUed3jJyf-34nOh_uW2zJXMKsvnw/exec";

fetch(API)
.then(res => res.json())
.then(data => {

  const status = document.getElementById("status");
  const select = document.getElementById("sheetSelect");
  const table = document.getElementById("table");

  console.log("DATA:", data);

  // VALIDASI DATA
  if (!data || Object.keys(data).length === 0) {
    status.innerHTML = "❌ DATA TIDAK ADA";
    return;
  }

  status.innerHTML = "✅ Data berhasil dimuat";

  const sheetNames = Object.keys(data);

  // dropdown
  select.innerHTML = "";
  sheetNames.forEach(name => {
    select.innerHTML += `<option value="${name}">${name}</option>`;
  });

  function render(sheetName) {
    const sheetData = data[sheetName];

    if (!sheetData || sheetData.length === 0) {
      table.innerHTML = "<tr><td>❌ DATA KOSONG</td></tr>";
      return;
    }

    const headers = Object.keys(sheetData[0]);

    table.innerHTML = "<tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr>";

    sheetData.forEach(row => {
      table.innerHTML += "<tr>" +
        headers.map(h => `<td>${row[h] ?? '-'}</td>`).join("") +
        "</tr>";
    });
  }

  select.onchange = () => render(select.value);

  render(sheetNames[0]);

})
.catch(err => {
  document.getElementById("status").innerHTML = "❌ ERROR: " + err;
});

</script>

</body>
</html>
