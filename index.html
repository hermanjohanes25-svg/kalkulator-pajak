<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard Grafik</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: Arial;
  padding:20px;
  background:#f5f5f5;
}

h1 {
  text-align:center;
}

select {
  padding:10px;
  margin-bottom:20px;
}

.chart-box {
  background:white;
  padding:20px;
  margin-bottom:20px;
  border-radius:10px;
}
</style>

</head>

<body>

<h1>Grafik Tenaga Kerja</h1>

<select id="sheetSelect"></select>

<div class="chart-box">
  <canvas id="chartTotal"></canvas>
</div>

<div class="chart-box">
  <canvas id="chartMasukKeluar"></canvas>
</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbyS65iL9bCzmhFzUY2QlhEssGKOdYsMs9Y869GSsHlUed3jJyf-34nOh_uW2zJXMKsvnw/exec";

let chart1, chart2;

fetch(API)
.then(res => res.json())
.then(data => {

  const select = document.getElementById("sheetSelect");
  const sheetNames = Object.keys(data);

  // dropdown
  sheetNames.forEach(name => {
    select.innerHTML += `<option value="${name}">${name}</option>`;
  });

  function render(sheetName){

    const sheetData = data[sheetName];

    if (!sheetData || sheetData.length === 0) return;

    const labels = sheetData.map(d => d.Tanggal);
    const total = sheetData.map(d => Number(d.Total) || 0);
    const masuk = sheetData.map(d => Number(d.Masuk) || 0);
    const keluar = sheetData.map(d => Number(d.Keluar) || 0);

    // hapus chart lama
    if (chart1) chart1.destroy();
    if (chart2) chart2.destroy();

    // grafik total
    chart1 = new Chart(document.getElementById("chartTotal"), {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Total Tenaga Kerja',
          data: total,
          borderWidth: 3
        }]
      }
    });

    // grafik masuk keluar
    chart2 = new Chart(document.getElementById("chartMasukKeluar"), {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [
          { label: 'Masuk', data: masuk },
          { label: 'Keluar', data: keluar }
        ]
      }
    });

  }

  select.onchange = () => render(select.value);

  render(sheetNames[0]);

});

</script>

</body>
</html>
