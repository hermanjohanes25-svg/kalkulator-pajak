<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard Multi Sheet</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
  background: #f5f5f5;
}

h1 {
  text-align: center;
}

select {
  padding: 10px;
  margin-bottom: 15px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}

th, td {
  border: 1px solid #ccc;
  padding: 8px;
  text-align: center;
}

th {
  background: #333;
  color: white;
}

.status {
  margin-bottom: 10px;
  font-weight: bold;
}
</style>

</head>

<body>

<h1>Dashboard Tenaga Kerja</h1>

<div class="status" id="status">⏳ Loading data...</div>

<select id="sheetSelect"></select>

<table id="table"></table>

<script>

// 🔴 GANTI DENGAN URL API KAMU
const API = "https://script.google.com/macros/s/AKfycbxVqTE84jSZkDt5uxUuHOmtSsb3N2q5AO3KncaqheGGwwoAEavZtUwvw9Ghp7othNPuYw/exec";

fetch(API)
.then(res => res.json())
.then(data => {

  const status = document.getElementById("status");
  const select = document.getElementById("sheetSelect");
  const table = document.getElementById("table");

  console.log("DATA API:", data);

  // ❌ CEK DATA KOSONG
  if (!data || Object.keys(data).length === 0) {
    status.innerHTML = "❌ DATA TIDAK DITEMUKAN";
    return;
  }

  status.innerHTML = "✅ Data berhasil dimuat";

  const sheetNames = Object.keys(data);

  // isi dropdown
  sheetNames.forEach(name => {
    select.innerHTML += `<option value="${name}">${name}</option>`;
  });

  // fungsi render tabel
  function render(sheetName) {

    const sheetData = data[sheetName];

    // ❌ jika sheet kosong
    if (!sheetData || sheetData.length === 0) {
      table.innerHTML = "<tr><td>❌ DATA KOSONG DI SHEET INI</td></tr>";
      return;
    }

    const headers = Object.keys(sheetData[0]);

    // header tabel
    table.innerHTML = "<tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr>";

    // isi tabel
    sheetData.forEach(row => {
      table.innerHTML += "<tr>" +
        headers.map(h => `<td>${row[h] ?? '-'}</td>`).join("") +
        "</tr>";
    });
  }

  // event dropdown
  select.addEventListener("change", function(){
    render(this.value);
  });

  // tampilkan pertama
  render(sheetNames[0]);

})
.catch(err => {
  document.getElementById("status").innerHTML = "❌ ERROR: " + err;
});

</script>

</body>
</html>
