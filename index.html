<!DOCTYPE html>
<html>
<head>
  <title>Dashboard Tenaga Kerja</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial; padding: 20px; }
    h1 { text-align: center; }
    .card {
      display: inline-block;
      padding: 15px;
      margin: 10px;
      background: #f4f4f4;
      border-radius: 10px;
      width: 200px;
      text-align: center;
      font-weight: bold;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 20px;}
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center;}
    th { background: #eee; }
  </style>
</head>
<body>

<h1>Dashboard Tenaga Kerja</h1>

<div id="cards"></div>

<canvas id="chart"></canvas>

<table id="table"></table>

<script>
const API = "https://script.google.com/macros/s/AKfycbyeh_7t2i_JJGe5YP8TM26l7z1a8RyWSBY9nsKVJRfhC7MMleIcVZXSmfSl9RAUlSFj/exec";

fetch(API)
  .then(res => res.json())
  .then(data => {

    // ===== AMBIL DATA TERAKHIR =====
    let last = data[data.length - 1];

    // ===== CARD SUMMARY =====
    document.getElementById("cards").innerHTML = `
      <div class="card">Total: ${last.Total}</div>
      <div class="card">Masuk: ${last.Masuk}</div>
      <div class="card">Keluar: ${last.Keluar}</div>
      <div class="card">Kebutuhan: ${last.Kebutuhan}</div>
      <div class="card">Kekurangan: ${last.Kekurangan}</div>
    `;

    // ===== TABLE =====
    let table = document.getElementById("table");
    let headers = Object.keys(data[0]);

    table.innerHTML += "<tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr>";

    data.forEach(row => {
      table.innerHTML += "<tr>" + headers.map(h => `<td>${row[h]}</td>`).join("") + "</tr>";
    });

    // ===== CHART =====
    const labels = data.map(d => d.Tanggal);
    const total = data.map(d => d.Total);

    new Chart(document.getElementById("chart"), {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Total Tenaga Kerja',
          data: total,
          borderWidth: 2
        }]
      }
    });

  });
</script>

</body>
</html>
